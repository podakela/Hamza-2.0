/* =====================================================================
   GAME FLOW
   ===================================================================== */
const PREVIEWS = VILLAINS.map(v=>{
  const f = new Fighter(v, 0, 1, false);
  f.animT = Math.random()*6;
  f.pose = computePose(f);
  return f;
});

const STAGE_NAMES = {
  desert:'SANDS OF ARABIA',
  elephantCity:'THE OLD CITY GATE',
  egypt:'ANCIENT EGYPT',
  market:'THE GOLD MARKET',
  magicPalace:'HALL OF SORCERY',
  courtyard:'THE JUDGEMENT COURTYARD',
  warehouse:'THE ABANDONED WAREHOUSE',
  hell:'THE BURNING PIT'
};

function startFight(idx){
  const vdef = VILLAINS[idx];
  game.stageIndex = idx;
  game.player = new Fighter(HERO, 380, 1, true);
  game.enemy  = new Fighter(vdef, 900, -1, false);
  game.player.foe = game.enemy;
  game.enemy.foe  = game.player;
  game.wins = [0,0]; game.round = 1;
  game.projectiles = [];
  game.phase = 'ready'; game.phaseT = 0;
  game.roundTime = ROUND_TIME;
  game.announce = 'ROUND 1';
  game.state = 'fight'; game.stateT = 0;
  game.comboCount = 0; game.comboTimer = 0;
  Music.start(vdef.id === 'iblees' ? 'hell' : (Math.random()<0.5?'fight':'fight2'));
  setZoom(1);
}
function resetRound(){
  const p = game.player, e = game.enemy;
  p.reset(380, 1); e.reset(900, -1);
  p.foe = e; e.foe = p;
  game.projectiles = [];
  game.roundTime = ROUND_TIME;
  game.phase = 'ready'; game.phaseT = 0;
  game.announce = 'ROUND ' + game.round;
  game.comboCount = 0; game.comboTimer = 0;
  setZoom(1);
}
function onKO(){
  const p = game.player, e = game.enemy;
  const loser = (p.hp <= 0) ? p : e;
  const winner = (loser === p) ? e : p;
  loser.dead = true; loser.fall = 0;
  loser.vy = -430; loser.vx = -loser.facing * 240;
  loser.attack = null;
  winner.frozen = true; winner.attack = null;
  winner.vx = 0;
  game.phase = 'ko'; game.phaseT = 0;
  game.slowmo = 0.34;
  game.announce = 'K.O.'; game.announceT = 0;
  SFX.play('ko');
  Music.start('ko');
  addShake(30);
  emitHit(loser.x, loser.y - 150, '#ff8844', true);
  emitBlood(loser.x, loser.y - 150, -loser.facing, 30);
  setZoom(1.35);
}
function endMatch(playerWon){
  if(playerWon){
    game.score += 2000 + Math.round(game.player.hp) * 20;
    Music.start('victory'); SFX.play('win');
    game.state = 'victory';
  } else {
    game.state = 'gameover';
    Music.start('ko'); SFX.play('lose');
  }
  game.stateT = 0;
}

/* =====================================================================
   UPDATE
   ===================================================================== */
function update(dt){
  const rawDt = dt;
  game.t += dt;
  if(shake > 0) shake = Math.max(0, shake - dt*70);
  shakeX = (Math.random()-0.5) * shake;
  shakeY = (Math.random()-0.5) * shake;
  camera.zoom += (camera.targetZoom - camera.zoom) * Math.min(1, dt*6);
  if(game.damageFlash > 0) game.damageFlash -= dt*2.2;
  if(game.tintFlash){ game.tintFlash.t += dt; if(game.tintFlash.t >= game.tintFlash.life) game.tintFlash = null; }

  // button glow decay
  decayButtonGlow(dt);

  // combo timer
  if(game.comboTimer > 0){
    game.comboTimer -= dt;
    if(game.comboTimer <= 0) game.comboCount = 0;
  }

  // Hit-stop freezes fighter logic but not particles
  if(game.hitStop > 0){
    game.hitStop -= dt;
    Particles.update(dt);
    game.stateT += dt;
    if(game.state === 'fight' && game.phase === 'active'){
      updateProjectiles(dt * 0.05);
    }
    return;
  }

  switch(game.state){
    case 'logo':    updateLogo(dt); break;
    case 'select':  updateSelect(dt); break;
    case 'vs':      updateVS(dt); break;
    case 'fight':   updateFight(dt); break;
    case 'victory': updateVictory(dt); break;
    case 'gameover':updateGameOver(dt); break;
  }
  Particles.update(dt);
}
function updateLogo(dt){
  game.stateT += dt;
  if(tapped('confirm') || tapped('punch') || tapped('kick') || tapped('special')){
    SFX.play('confirm');
    game.state = 'select'; game.selected = 0;
    Music.start('select');
  }
}
function updateSelect(dt){
  const cols = 4;
  if(tapped('right')){ game.selected = (game.selected+1) % VILLAINS.length; SFX.play('move'); }
  if(tapped('left')){ game.selected = (game.selected-1+VILLAINS.length) % VILLAINS.length; SFX.play('move'); }
  if(tapped('down')){ game.selected = (game.selected+cols) % VILLAINS.length; SFX.play('move'); }
  if(tapped('up')){ game.selected = (game.selected-cols+VILLAINS.length) % VILLAINS.length; SFX.play('move'); }
  if(tapped('confirm') || tapped('punch') || tapped('special')){
    SFX.play('confirm');
    game.vsIndex = game.selected;
    game.state = 'vs'; game.stateT = 0;
  }
}
function updateVS(dt){
  game.stateT += dt;
  if(game.stateT > 3.4 || tapped('confirm') || tapped('punch')){
    startFight(game.vsIndex);
  }
}
function updateFight(dt){
  const p = game.player, e = game.enemy;
  if(!p || !e) return;
  game.phaseT += dt;

  if(game.phase === 'ready'){
    if(game.phaseT > 1.1 && game.announce !== 'FIGHT!'){
      game.announce = 'FIGHT!'; SFX.play('announce');
    }
    if(game.phaseT > 2.0){ game.phase = 'active'; game.announce = ''; }
    p.update(dt*0.7, {});
    e.update(dt*0.7, {});
    return;
  }
  if(game.phase === 'active'){
    game.roundTime -= dt;
    if(game.roundTime <= 0){
      game.roundTime = 0;
      if(p.hp > e.hp) e.hp = 0;
      else if(e.hp > p.hp) p.hp = 0;
      else e.hp = 0;
      onKO();
    }
    const pin = {
      left: held('left'), right: held('right'),
      up: held('up'), down: held('down'),
      punch: held('punch'), kick: held('kick'),
      block: held('block'), special: held('special')
    };
    const ein = aiThink(e, p, dt);
    p.update(dt, pin);
    e.update(dt, ein);
    checkMelee(p, e); checkMelee(e, p);
    updateProjectiles(dt);
    // push apart
    const dx = e.x - p.x;
    const minDist = 62;
    if(Math.abs(dx) < minDist && !p.dead && !e.dead){
      const push = (minDist - Math.abs(dx))/2 * Math.sign(dx || 1);
      p.x -= push*0.5; e.x += push*0.5;
      p.x = clamp(p.x, 80, 1200);
      e.x = clamp(e.x, 80, 1200);
    }
    if(p.hp <= 0 || e.hp <= 0) onKO();
    return;
  }
  if(game.phase === 'ko'){
    const sdt = dt * 0.34;
    p.update(sdt, {}); e.update(sdt, {});
    updateProjectiles(sdt);
    if(game.phaseT > 3.0){
      const playerWon = (e.hp <= 0);
      if(playerWon) game.wins[0]++; else game.wins[1]++;
      if(game.wins[0] >= ROUNDS_TO_WIN) endMatch(true);
      else if(game.wins[1] >= ROUNDS_TO_WIN) endMatch(false);
      else {
        game.round++;
        resetRound();
        Music.start(VILLAINS[game.stageIndex].id === 'iblees' ? 'hell' : (Math.random()<0.5?'fight':'fight2'));
      }
    }
  }
}
function checkMelee(att, def){
  if(!att.attack || att.attack.hit) return;
  if(att.hitstun > 0) return;
  const m = att.attack.def;
  if(!m.hw) return;
  if(att.attack.t < m.startup || att.attack.t > m.startup + m.active) return;
  const hb = getHitbox(att);
  const bb = bodyBox(def);
  if(rectOverlap(hb, bb)){
    att.attack.hit = true;
    def.takeDamage(m.damage, att, m);
  }
}
function updateVictory(dt){
  game.stateT += dt;
  if(game.stateT > 1.0 && (tapped('confirm') || tapped('punch'))){
    if(game.stageIndex + 1 < VILLAINS.length){
      game.vsIndex = game.stageIndex + 1;
      game.state = 'vs'; game.stateT = 0;
      Music.start('select');
    } else {
      game.state = 'gameover'; game.stateT = 0; game.wonAll = true;
    }
  }
}
function updateGameOver(dt){
  game.stateT += dt;
  if(game.stateT > 1.0 && (tapped('confirm') || tapped('punch'))){
    game.state = 'logo'; game.score = 0;
    Music.start('title');
  }
}

/* ---------- AI ---------- */
function aiThink(me, foe, dt){
  const inp = {left:false,right:false,up:false,down:false,
               punch:false,kick:false,block:false,special:false};
  if(!me || !foe || me.dead || foe.dead || me.frozen) return inp;
  const A = me.def.ai || {agg:0.5, react:0.5};
  const d = Math.abs(foe.x - me.x);
  const dir = foe.x > me.x ? 1 : -1;
  me.aiT -= dt;
  if(me.aiT <= 0){
    const r = Math.random();
    if(d > 300) me.aiAct = r < 0.88 ? 'approach' : 'wait';
    else if(d > 150) me.aiAct = r < 0.55 ? 'approach' : (r < 0.78 ? 'special' : (r < 0.9 ? 'wait' : 'retreat'));
    else {
      if(r < 0.34 + A.agg*0.30) me.aiAct = 'attack';
      else if(r < 0.68) me.aiAct = 'block';
      else if(r < 0.84) me.aiAct = 'retreat';
      else me.aiAct = 'special';
    }
    me.aiT = 0.16 + Math.random()*(0.55 - A.react*0.25);
  }
  for(const pr of game.projectiles){
    if(pr.owner === me) continue;
    const toward = Math.sign(pr.vx||0) === Math.sign(me.x - pr.x) || (pr.vx===0);
    if(toward && Math.abs(pr.x - me.x) < 260 && pr.y > GROUND - 260){
      if(Math.random() < 0.10 + A.react*0.22 && me.onGround) inp.up = true;
      else if(Math.random() < 0.35) inp.block = true;
    }
  }
  switch(me.aiAct){
    case 'approach': if(dir > 0) inp.right = true; else inp.left = true; break;
    case 'retreat':  if(dir > 0) inp.left = true; else inp.right = true; break;
    case 'block':    inp.block = true; if(Math.random() < 0.12) inp.punch = true; break;
    case 'attack':
      if(d < 115){ inp.punch = Math.random() < 0.62; if(!inp.punch) inp.kick = true; }
      else if(d < 165){ inp.kick = true; }
      else { if(dir>0) inp.right = true; else inp.left = true; }
      break;
    case 'special':
      if(me.specialCd <= 0 && d < 480 && Math.random() < 0.4) inp.special = true;
      else { if(dir > 0) inp.right = true; else inp.left = true; }
      break;
  }
  return inp;
}

/* =====================================================================
   RENDER
   ===================================================================== */
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  // apply shake + zoom
  ctx.save();
  ctx.translate(W/2 + shakeX, H/2 + shakeY);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-W/2, -H/2);

  switch(game.state){
    case 'logo':     renderLogo(); break;
    case 'select':   renderSelect(); break;
    case 'vs':       renderVS(); break;
    case 'fight':    renderFight(); break;
    case 'victory':  renderVictory(); break;
    case 'gameover': renderGameOver(); break;
  }
  ctx.restore();

  // damage flash
  if(game.damageFlash > 0){
    ctx.fillStyle = `rgba(255,60,30,${game.damageFlash*0.4})`;
    ctx.fillRect(0,0,W,H);
  }
  // tint flash
  if(game.tintFlash){
    const a = 1 - game.tintFlash.t/game.tintFlash.life;
    ctx.fillStyle = `rgba(${game.tintFlash.color},${a*0.28})`;
    ctx.fillRect(0,0,W,H);
  }

  // vignette
  const vg = ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.98);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.62)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);
}

/* ---------- LOGO ---------- */
function renderLogo(){
  const t = game.t;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0508');
  g.addColorStop(0.5,'#1c0a08');
  g.addColorStop(1,'#3a1206');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<90;i++){
    const ex = (i*173 + t*30*(0.3+(i%4)*0.3)) % W;
    const ey = H - ((t*70 + i*53) % (H+120));
    const a = 0.15 + (i%5)*0.12;
    ctx.fillStyle = `rgba(255,${120+(i*29)%110},30,${a})`;
    ctx.beginPath(); ctx.arc(ex, ey, 1.4 + (i%3)*0.9, 0, 7); ctx.fill();
  }
  const gg = ctx.createRadialGradient(W/2, H-60, 20, W/2, H-60, 700);
  gg.addColorStop(0,'rgba(255,120,20,0.35)');
  gg.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle = gg;
  ctx.fillRect(0,H-360,W,360);

  // spinning emblem
  ctx.save();
  ctx.translate(W/2, 300);
  ctx.rotate(t*0.35);
  ctx.strokeStyle = 'rgba(255,140,30,0.35)';
  ctx.lineWidth = 4;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.arc(0,0, 190 + i*34, i*1.2, i*1.2 + 4.4);
    ctx.stroke();
  }
  ctx.restore();

  const pulse = 1 + Math.sin(t*2.4)*0.018;
  ctx.save();
  ctx.translate(W/2, 250);
  ctx.scale(pulse, pulse);
  ctx.shadowColor = '#ff6a10';
  ctx.shadowBlur = 42 + Math.sin(t*3)*14;
  bigText('FATAL', 0, -55, 130, ['#ffe08a','#ff8a1a'], 1, 1, '#2a0800');
  bigText('ARENA', 0, 70, 130, ['#ffd070','#e04a10'], 1, 1, '#2a0800');
  ctx.shadowBlur = 0;
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.font = '700 22px "Arial Black", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffb060';
  ctx.fillText('EIGHT VILLAINS  ·  ONE HERO  ·  NO MERCY', W/2, 400);
  ctx.restore();

  const blink = 0.45 + Math.abs(Math.sin(t*3))*0.55;
  bigText('PRESS  ENTER  /  TAP  TO  START', W/2, 560, 32,
          ['#ffffff','#ffcf80'], blink, 1, '#000');

  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.font = '600 15px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ccc';
  ctx.fillText('JOYSTICK: LEFT  ·  PUNCH: J  ·  KICK: K  ·  SPECIAL: L  ·  BLOCK: SPACE', W/2, 660);
  ctx.restore();

  if(game.best > 0){
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.font = '700 18px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd070';
    ctx.fillText('BEST SCORE: ' + game.best, W/2, 470);
    ctx.restore();
  }
}

/* ---------- SELECT ---------- */
function renderSelect(){
  const t = game.t;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b0714'); g.addColorStop(0.6,'#1a0f22'); g.addColorStop(1,'#2b1220');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = 'rgba(255,120,40,0.07)';
  ctx.lineWidth = 1;
  for(let x=-((t*40)%80); x<W; x+=80){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=80){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  bigText('CHOOSE  YOUR  OPPONENT', W/2, 62, 42, ['#ffd070','#e05a10'], 1, 1, '#000');

  // hero panel
  const hx = 40, hy = 110, hw = 240, hh = 510;
  ctx.save();
  ctx.fillStyle = 'rgba(20,30,60,0.85)';
  roundRect(ctx, hx, hy, hw, hh, 12); ctx.fill();
  ctx.strokeStyle = '#6fa8ff'; ctx.lineWidth = 3;
  roundRect(ctx, hx, hy, hw, hh, 12); ctx.stroke();
  // preview
  ctx.save();
  ctx.beginPath(); roundRect(ctx, hx+6, hy+6, hw-12, hh-90, 10); ctx.clip();
  const hp = getHeroPreview();
  ctx.translate(hx+hw/2, hy+hh-100);
  ctx.scale(1.32, 1.32);
  ctx.translate(-hp.x, -hp.y);
  drawFighter(ctx, hp);
  ctx.restore();
  ctx.font = '900 26px "Arial Black", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#cfe6ff';
  ctx.fillText('HAMZA', hx+hw/2, hy+hh-54);
  ctx.font = '600 14px Arial, sans-serif';
  ctx.fillStyle = '#9fc0e8';
  ctx.fillText('THE RIGHTEOUS', hx+hw/2, hy+hh-32);
  ctx.restore();

  // villain grid
  const cols = 4;
  const gx = 320, gy = 120;
  const cw = 210, ch = 245, gap = 15;
  for(let i=0;i<VILLAINS.length;i++){
    const c = i % cols, r = Math.floor(i/cols);
    const x = gx + c*(cw+gap);
    const y = gy + r*(ch+gap);
    const sel = (i === game.selected);
    const pulse = sel ? 1 + Math.sin(t*5)*0.02 : 1;

    ctx.save();
    ctx.translate(x + cw/2, y + ch/2);
    ctx.scale(pulse, pulse);
    ctx.translate(-(x + cw/2), -(y + ch/2));

    const bg = ctx.createLinearGradient(x,y,x,y+ch);
    bg.addColorStop(0, sel ? 'rgba(80,20,20,0.95)' : 'rgba(24,18,30,0.9)');
    bg.addColorStop(1, sel ? 'rgba(40,10,10,0.95)' : 'rgba(14,10,20,0.9)');
    ctx.fillStyle = bg;
    roundRect(ctx, x, y, cw, ch, 10); ctx.fill();
    ctx.strokeStyle = sel ? '#ff9a2a' : 'rgba(160,140,200,0.35)';
    ctx.lineWidth = sel ? 4 : 2;
    roundRect(ctx, x, y, cw, ch, 10); ctx.stroke();
    if(sel){
      ctx.shadowColor = '#ff8a20';
      ctx.shadowBlur = 30;
      ctx.strokeStyle = 'rgba(255,160,60,0.85)';
      ctx.lineWidth = 2;
      roundRect(ctx, x, y, cw, ch, 10); ctx.stroke();
      ctx.shadowBlur = 0;
    }
    // preview
    ctx.save();
    ctx.beginPath(); roundRect(ctx, x+6, y+6, cw-12, ch-58, 8); ctx.clip();
    const pv = PREVIEWS[i];
    ctx.translate(x + cw/2, y + ch - 62);
    ctx.scale(1.02, 1.02);
    ctx.translate(-pv.x, -pv.y);
    drawFighter(ctx, pv);
    ctx.restore();
    // name
    ctx.font = '900 15px "Arial Black", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = sel ? '#ffd070' : '#c8bcd8';
    const nm = VILLAINS[i].name;
    ctx.fillText(nm.length > 18 ? nm.slice(0,17)+'…' : nm, x+cw/2, y+ch-34);
    ctx.font = '600 11px Arial, sans-serif';
    ctx.fillStyle = sel ? '#ffab60' : '#8a80a0';
    ctx.fillText(VILLAINS[i].title, x+cw/2, y+ch-17);
    ctx.restore();
  }

  const v = VILLAINS[game.selected];
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, H-58, W, 58);
  ctx.font = '700 20px "Arial Black", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffb060';
  ctx.fillText(`"${v.intro}"`, W/2, H-24);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.6;
  ctx.font = '600 13px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#aaa';
  ctx.fillText('ARROWS / JOYSTICK to browse  ·  ENTER / PUNCH to fight', 24, H-70);
  ctx.restore();
}
function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}

let heroPreview = null;
function getHeroPreview(){
  if(!heroPreview) heroPreview = new Fighter(HERO, 0, 1, true);
  heroPreview.animT += 0.016;
  heroPreview.clothT += 0.016;
  heroPreview.pose = computePose(heroPreview);
  return heroPreview;
}

/* ---------- VS ---------- */
function renderVS(){
  const t = game.stateT;
  const vdef = VILLAINS[game.vsIndex];
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#12060a'); g.addColorStop(0.5,'#2a0d10'); g.addColorStop(1,'#12060a');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.globalAlpha = 0.14;
  ctx.strokeStyle = '#ff8030';
  ctx.lineWidth = 3;
  for(let i=0;i<40;i++){
    const y = (i*37 + t*400) % H;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y + 60); ctx.stroke();
  }
  ctx.restore();

  const pvA = getVsPreview('hero');
  const pvB = getVsPreview(game.vsIndex);
  const slide = Math.min(1, t*2.6);
  const ease = 1 - Math.pow(1-slide, 3);

  ctx.save();
  ctx.translate(lerp(-420, 0, ease), 0);
  ctx.save();
  ctx.translate(330, GROUND + 60);
  ctx.scale(1.85, 1.85);
  ctx.translate(-pvA.x, -pvA.y);
  drawFighter(ctx, pvA);
  ctx.restore();
  ctx.restore();

  ctx.save();
  ctx.translate(lerp(420, 0, ease), 0);
  ctx.save();
  ctx.translate(950, GROUND + 60);
  ctx.scale(1.85, 1.85);
  ctx.translate(-pvB.x, -pvB.y);
  drawFighter(ctx, pvB);
  ctx.restore();
  ctx.restore();

  const vsScale = 1 + Math.max(0, 1 - t*3)*1.6;
  bigText('VS', W/2, 300, 130, ['#fff0a0','#ff5a10'], Math.min(1, t*3), vsScale, '#300000');

  ctx.save();
  ctx.textAlign = 'center';
  bigText('HAMZA', 330, 150, 46, ['#ffffff','#9fc8ff'], ease, 1, '#000');
  bigText(vdef.name, 950, 150, 40, ['#ffd070','#e04a10'], ease, 1, '#000');
  ctx.font = '600 16px Arial, sans-serif';
  ctx.fillStyle = '#ffb060';
  ctx.fillText(vdef.title, 950, 190);
  ctx.restore();

  if(t > 1.0){
    const a = Math.min(1, (t-1.0)*1.5);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = '700 22px "Arial Black", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe0a0';
    ctx.fillText('"' + HERO.intro + '"', 330, H-130);
    ctx.fillStyle = '#ff9a5a';
    ctx.fillText('"' + vdef.intro + '"', 950, H-130);
    ctx.restore();
  }
  ctx.save();
  ctx.globalAlpha = Math.min(1, t*2);
  ctx.font = '700 18px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#c8a070';
  ctx.fillText('LOCATION: ' + STAGE_NAMES[vdef.stage], W/2, H-70);
  ctx.restore();
}

let vsPreviews = {};
function getVsPreview(id){
  if(id === 'hero'){
    if(!vsPreviews.hero) vsPreviews.hero = new Fighter(HERO, 0, 1, true);
    const f = vsPreviews.hero;
    f.animT += 0.016; f.clothT += 0.016;
    f.pose = computePose(f);
    return f;
  } else {
    if(!vsPreviews[id]) vsPreviews[id] = new Fighter(VILLAINS[id], 0, -1, false);
    const f = vsPreviews[id];
    f.animT += 0.016; f.clothT += 0.016;
    f.facing = -1;
    f.pose = computePose(f);
    return f;
  }
}

/* ---------- FIGHT ---------- */
function renderFight(){
  const p = game.player, e = game.enemy;
  if(!p || !e) return;
  drawStage(VILLAINS[game.stageIndex].stage, game.t);

  const order = (p.x < e.x) ? [e, p] : [p, e];
  for(const f of order) drawFighter(ctx, f);
  for(const pr of game.projectiles) drawProjectile(ctx, pr);
  Particles.draw(ctx);

  drawHUD();

  if(game.announce && game.phase !== 'active'){
    let a = 1, sc = 1;
    if(game.phase === 'ready'){
      const tt = game.phaseT;
      a = clamp(tt < 0.2 ? tt/0.2 : (tt > 1.8 ? (2.0-tt)/0.2 : 1), 0, 1);
      sc = 1 + Math.max(0, 1 - tt*4)*0.9;
    } else if(game.phase === 'ko'){
      const tt = game.phaseT;
      a = clamp(tt < 0.15 ? tt/0.15 : (tt > 2.6 ? (3.0-tt)/0.4 : 1), 0, 1);
      sc = 1 + Math.max(0, 1 - tt*3)*1.4;
    }
    bigText(game.announce, W/2, H/2 - 40,
            game.phase === 'ko' ? 150 : 90,
            ['#fff0a0','#ff3a00'], a, sc, '#300000');
  }
  // combo counter
  if(game.comboCount > 1 && game.comboTimer > 0){
    const a = Math.min(1, game.comboTimer*2);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'left';
    const x = 60, y = H - 130;
    ctx.font = '900 70px "Arial Black", Arial, sans-serif';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 8;
    ctx.strokeText(game.comboCount + '', x, y);
    const grd = ctx.createLinearGradient(0, y-60, 0, y+10);
    grd.addColorStop(0,'#fff0a0'); grd.addColorStop(1,'#ff5a10');
    ctx.fillStyle = grd;
    ctx.fillText(game.comboCount + '', x, y);
    ctx.font = '900 22px "Arial Black", Arial, sans-serif';
    ctx.fillStyle = '#ffb060';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 5;
    ctx.strokeText('HIT COMBO', x + 8, y + 26);
    ctx.fillText('HIT COMBO', x + 8, y + 26);
    ctx.restore();
  }
}

function drawHUD(){
  const p = game.player, e = game.enemy;
  const barW = 470, barH = 30, y = 30;

  drawBar(40, y, barW, barH, p.hp/p.maxHp, true);
  drawBar(W-40-barW, y, barW, barH, e.hp/e.maxHp, false);

  ctx.save();
  ctx.font = '900 22px "Arial Black", Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  ctx.strokeText('HAMZA', 44, y + barH + 26);
  ctx.fillText('HAMZA', 44, y + barH + 26);
  ctx.textAlign = 'right';
  ctx.strokeText(e.name, W-44, y + barH + 26);
  ctx.fillText(e.name, W-44, y + barH + 26);
  ctx.restore();

  const timeLeft = Math.ceil(game.roundTime);
  const pulse = timeLeft <= 10 ? 1 + Math.sin(game.t*10)*0.08 : 1;
  ctx.save();
  ctx.translate(W/2, y + barH/2 + 6);
  ctx.scale(pulse, pulse);
  bigText(String(timeLeft).padStart(2,'0'), 0, 0, 62,
          timeLeft <= 10 ? ['#ff9a60','#e02000'] : ['#ffe9a0','#e0a020'], 1, 1, '#000');
  ctx.restore();

  for(let i=0;i<ROUNDS_TO_WIN;i++){
    const px = 40 + barW + 22 + i*26;
    ctx.beginPath();
    ctx.arc(px, y + barH/2, 10, 0, 7);
    if(i < game.wins[0]){
      const g = ctx.createRadialGradient(px-2, y+barH/2-2, 1, px, y+barH/2, 10);
      g.addColorStop(0,'#fff0a0'); g.addColorStop(1,'#c88a10');
      ctx.fillStyle = g;
    } else ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2; ctx.stroke();
  }
  for(let i=0;i<ROUNDS_TO_WIN;i++){
    const px = W - 40 - barW - 22 - i*26;
    ctx.beginPath();
    ctx.arc(px, y + barH/2, 10, 0, 7);
    if(i < game.wins[1]){
      const g = ctx.createRadialGradient(px-2, y+barH/2-2, 1, px, y+barH/2, 10);
      g.addColorStop(0,'#fff0a0'); g.addColorStop(1,'#c88a10');
      ctx.fillStyle = g;
    } else ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2; ctx.stroke();
  }

  ctx.save();
  ctx.font = '900 20px "Arial Black", Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd070';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  ctx.strokeText('SCORE  ' + game.score, 44, H - 26);
  ctx.fillText('SCORE  ' + game.score, 44, H - 26);
  ctx.restore();

  // Special ready indicator with ring
  const cd = game.player.specialCd;
  const cdMax = HERO.special.cd;
  const ready = cd <= 0;
  ctx.save();
  ctx.textAlign = 'right';
  ctx.font = '900 18px "Arial Black", Arial, sans-serif';
  ctx.fillStyle = ready ? '#7dff9a' : '#888';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  const txt = ready ? 'SPECIAL READY [L]' : 'SPECIAL ' + cd.toFixed(1) + 's';
  ctx.strokeText(txt, W - 44, H - 26);
  ctx.fillText(txt, W - 44, H - 26);
  ctx.restore();
}
function drawBar(x, y, w, h, pct, isPlayer){
  pct = clamp(pct, 0, 1);
  // frame
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  roundRect(ctx, x-4, y-4, w+8, h+8, 6);
  ctx.fill();
  ctx.strokeStyle = '#c8a050'; ctx.lineWidth = 2;
  roundRect(ctx, x-4, y-4, w+8, h+8, 6);
  ctx.stroke();
  // background
  ctx.fillStyle = '#1a0505';
  ctx.fillRect(x, y, w, h);
  // fill
  const fw = w * pct;
  const g = ctx.createLinearGradient(0, y, 0, y+h);
  if(pct > 0.5){
    g.addColorStop(0,'#b8ffb0'); g.addColorStop(0.4,'#3ecc40'); g.addColorStop(1,'#0a6a18');
  } else if(pct > 0.25){
    g.addColorStop(0,'#fff090'); g.addColorStop(0.4,'#f0a020'); g.addColorStop(1,'#9a4a00');
  } else {
    g.addColorStop(0,'#ffb0a0'); g.addColorStop(0.4,'#e02020'); g.addColorStop(1,'#600000');
  }
  ctx.fillStyle = g;
  if(isPlayer) ctx.fillRect(x, y, fw, h);
  else ctx.fillRect(x + w - fw, y, fw, h);
  // gloss
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fillRect(x, y+3, w, 7);
  // shimmer sweep
  const sweep = (game.t * 200) % (w + 300);
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, fw, h);
  ctx.clip();
  const sg = ctx.createLinearGradient(sweep-60, 0, sweep+60, 0);
  sg.addColorStop(0, 'rgba(255,255,255,0)');
  sg.addColorStop(0.5, 'rgba(255,255,255,0.25)');
  sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(x, y, fw, h);
  ctx.restore();
  ctx.restore();
}

/* ---------- VICTORY ---------- */
function renderVictory(){
  const t = game.stateT;
  const p = game.player, e = game.enemy;
  drawStage(VILLAINS[game.stageIndex].stage, game.t);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0,0,W,H);
  if(e) drawFighter(ctx, e);
  if(p){
    p.frozen = true;
    p.state = 'win';
    p.animT += 0.016; p.clothT += 0.016;
    p.pose = computePose(p);
    drawFighter(ctx, p);
  }
  Particles.draw(ctx);
  const sc = 1 + Math.max(0, 1-t*2.4)*0.7;
  bigText('HAMZA  WINS', W/2, 190, 92, ['#fff0a0','#ff8a10'], Math.min(1,t*2), sc, '#300000');
  ctx.save();
  ctx.globalAlpha = Math.min(1, Math.max(0,(t-0.5))*2);
  ctx.font = '900 34px "Arial Black", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd070';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
  ctx.strokeText('SCORE: ' + game.score, W/2, 300);
  ctx.fillText('SCORE: ' + game.score, W/2, 300);
  ctx.restore();
  if(t > 1.0){
    const blink = 0.5 + Math.abs(Math.sin(game.t*3))*0.5;
    const last = (game.stageIndex + 1 >= VILLAINS.length);
    bigText(last ? 'PRESS ENTER — FINAL RESULTS' : 'PRESS ENTER — NEXT OPPONENT',
            W/2, H-110, 28, ['#ffffff','#ffcf80'], blink, 1, '#000');
  }
}

/* ---------- GAME OVER ---------- */
function renderGameOver(){
  const t = game.stateT;
  const g = ctx.createLinearGradient(0,0,0,H);
  if(game.wonAll){
    g.addColorStop(0,'#0a1020'); g.addColorStop(0.5,'#123050'); g.addColorStop(1,'#0a1020');
  } else {
    g.addColorStop(0,'#160404'); g.addColorStop(0.5,'#3a0a06'); g.addColorStop(1,'#160404');
  }
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){
    const ex = (i*181 + game.t*25) % W;
    const ey = H - ((game.t*60 + i*47) % (H+100));
    ctx.fillStyle = game.wonAll
      ? `rgba(120,200,255,${0.08+(i%4)*0.05})`
      : `rgba(255,${100+(i*31)%100},30,${0.08+(i%4)*0.05})`;
    ctx.beginPath(); ctx.arc(ex, ey, 1.6+(i%3), 0, 7); ctx.fill();
  }
  if(game.wonAll){
    bigText('CHAMPION', W/2, 220, 110, ['#fff0a0','#ffb020'], 1,
            1 + Math.max(0,1-t*2.5)*0.6, '#201000');
    ctx.save();
    ctx.font = '700 30px "Arial Black", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#cfe6ff';
    ctx.fillText('ALL EIGHT VILLAINS DEFEATED', W/2, 330);
    ctx.restore();
  } else {
    bigText('DEFEATED', W/2, 220, 110, ['#ffb0a0','#c01000'], 1,
            1 + Math.max(0,1-t*2.5)*0.6, '#200000');
    ctx.save();
    ctx.font = '700 26px "Arial Black", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffb060';
    ctx.fillText('YOU WERE BEATEN BY ' + (game.enemy ? game.enemy.name : ''), W/2, 330);
    ctx.restore();
  }
  ctx.save();
  ctx.font = '900 44px "Arial Black", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd070';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 7;
  ctx.strokeText('SCORE: ' + game.score, W/2, 440);
  ctx.fillText('SCORE: ' + game.score, W/2, 440);
  ctx.font = '700 22px Arial, sans-serif';
  ctx.fillStyle = '#ddd';
  ctx.fillText('BEST: ' + game.best, W/2, 485);
  ctx.restore();
  const blink = 0.5 + Math.abs(Math.sin(game.t*3))*0.5;
  bigText('PRESS  ENTER  TO  RETURN', W/2, 600, 30, ['#ffffff','#ffcf80'], blink, 1, '#000');
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let lastT = performance.now();
function loop(now){
  let dt = (now - lastT) / 1000;
  lastT = now;
  if(dt > 0.05) dt = 0.05;
  if(dt <= 0) dt = 0.016;

  update(dt);
  render();
  clearJust();

  requestAnimationFrame(loop);
}

/* boot */
game.state = 'logo';
game.t = 0;
try{
  const b = localStorage.getItem('fatalArenaBest');
  if(b) game.best = parseInt(b,10) || 0;
}catch(e){}
requestAnimationFrame(loop);

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ Music.stop(); }
  else {
    lastT = performance.now();
    if(game.state === 'logo') Music.start('title');
    if(game.state === 'select') Music.start('select');
  }
});
setInterval(()=>{
  if(game.score > game.best){
    game.best = game.score;
    try{ localStorage.setItem('fatalArenaBest', String(game.best)); }catch(e){}
  }
}, 1000);
</script>
